<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="#fbbf24" stroke-width="8" stroke-dasharray="16 12" opacity="0.4"/>
  <g filter="url(#shadow)" transform="translate(256, 256)">
    <!-- 4 figures joined around central heart / togetherness emblem -->
    <circle cx="0" cy="-60" r="32" fill="#ffffff" />
    <circle cx="60" cy="0" r="32" fill="#ffffff" />
    <circle cx="0" cy="60" r="32" fill="#ffffff" />
    <circle cx="-60" cy="0" r="32" fill="#ffffff" />
    <!-- Center Naira/Togetherness Symbol -->
    <circle cx="0" cy="0" r="44" fill="#fbbf24" />
    <text x="0" y="16" font-family="Arial, sans-serif" font-weight="900" font-size="44" fill="#78350f" text-anchor="middle">₦</text>
  </g>
  <text x="256" y="440" font-family="serif" font-weight="bold" font-size="34" fill="#fef3c7" text-anchor="middle" letter-spacing="2">4 COUSINS</text>
</svg>
